# Builds the site on every push to main and publishes it to GitHub Pages.
#
# It publishes both ways, so it works whichever Pages source the repo uses:
#   - "Deploy from a branch" serves the gh-pages branch pushed below
#   - "GitHub Actions" serves the artifact handed to deploy-pages
# The deploy-pages step is allowed to fail when the source is a branch.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: touch dist/.nojekyll

      - name: Publish dist/ to gh-pages
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          rm -rf .git

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy (when the Pages source is GitHub Actions)
        uses: actions/deploy-pages@v4
        continue-on-error: true
